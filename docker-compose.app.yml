services:
  fastapi-backend:
    build:
      context: .
      dockerfile: backend_case/Dockerfile
    container_name: fastapi_backend_UML
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:071104@postgres:5432/uml_bd
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=uml_bd
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=071104
      - REDIS_URL=redis://redis:6379/0
      - GENERATOR_SPRING_URL=http://spring-backend:7000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el entorno o en un .env junto al compose}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--ws-max-size", "8192"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  redis:
    image: public.ecr.aws/docker/library/redis:7
    container_name: redis_server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - backend

  spring-backend:
    build: ./back_generator_uml/
    container_name: spring_backend
    environment:
      - SERVER_PORT=7000
    ports:
      - "7000:7000"
    networks:
      - backend
      - frontend

  angular-app:
    build: ./front_generador_bd/
    container_name: angular_frontend
    ports:
      - "4000:4000"
    networks:
      - frontend
      - backend

networks:
  backend:
    external: true
  frontend:
    driver: bridge