<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn"
>
  <!-- Modal Card -->
  <div
    class="w-full max-w-md bg-surface-container rounded-2xl border border-neutral-700 shadow-2xl overflow-hidden animate-scaleUp"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div class="p-6 pb-4 border-b border-neutral-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-primary-500/15 text-primary-400 flex items-center justify-center border border-primary-500/20">
          <sc-icon name="group_add" [size]="20"></sc-icon>
        </div>
        <div>
          <h3 class="text-base font-semibold text-white tracking-tight">Unirse a Proyecto Compartido</h3>
          <p class="text-xs text-neutral-400">Introduce el identificador o código de sala</p>
        </div>
      </div>

      <button
        type="button"
        (click)="close()"
        class="text-neutral-400 hover:text-white p-1 rounded-lg hover:bg-surface-container-high transition-colors cursor-pointer"
        title="Cerrar modal"
      >
        <sc-icon name="close" [size]="18"></sc-icon>
      </button>
    </div>

    <!-- Modal Form Body -->
    <form (ngSubmit)="submit()" class="p-6 space-y-4">
      <sc-input
        inputId="room-code-input"
        label="Código de Sala / UUID"
        icon="key"
        placeholder="ej. ecommerce-multivendor-8f3k"
        [(ngModel)]="roomCode"
        name="roomCode"
        [required]="true"
        [hint]="'Introduce el código facilitado por el anfitrión'"
        [error]="errorMessage"
      ></sc-input>

      <div class="pt-2 flex items-center justify-end gap-2.5 border-t border-neutral-800">
        <sc-button
          type="button"
          variant="ghost"
          size="md"
          (onClick)="close()"
        >
          Cancelar
        </sc-button>

        <sc-button
          type="submit"
          variant="primary"
          size="md"
          icon="login"
          [loading]="loading"
        >
          Unirse a la sala
        </sc-button>
      </div>
    </form>
  </div>
</div>
