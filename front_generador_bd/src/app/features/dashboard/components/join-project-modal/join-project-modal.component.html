<sc-modal-shell
  [isOpen]="isOpen"
  icon="group_add"
  title="Unirse a Proyecto Compartido"
  subtitle="Introduce el identificador o código de sala"
  size="md"
  (closed)="close()"
>
  <form (ngSubmit)="submit()" class="p-6 space-y-4">
    <sc-input
      inputId="room-code-input"
      label="Código de Sala / UUID"
      icon="key"
      placeholder="ej. ecommerce-multivendor-8f3k"
      [(ngModel)]="roomCode"
      name="roomCode"
      [required]="true"
      [hint]="'Introduce el código facilitado por el anfitrión'"
      [error]="errorMessage || error"
    ></sc-input>

    <div class="pt-2 flex items-center justify-end gap-2.5 border-t border-neutral-800">
      <sc-button
        type="button"
        variant="ghost"
        size="md"
        (onClick)="close()"
      >
        Cancelar
      </sc-button>

      <sc-button
        type="submit"
        variant="primary"
        size="md"
        icon="login"
        [loading]="loading"
      >
        Unirse a la sala
      </sc-button>
    </div>
  </form>
</sc-modal-shell>
