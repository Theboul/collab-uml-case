<sc-modal-shell
  [isOpen]="isOpen"
  icon="create_new_folder"
  title="Nuevo Proyecto de Base de Datos"
  subtitle="Configura los parámetros iniciales del esquema"
  size="lg"
  (closed)="close()"
>
  <form (ngSubmit)="submit()" class="p-6 space-y-5">
    <!-- Project Name -->
    <sc-input
      inputId="new-project-name"
      label="Nombre del Proyecto"
      icon="title"
      placeholder="ej. Sistema Contable Core"
      [(ngModel)]="name"
      name="name"
      [required]="true"
      [error]="nameError"
    ></sc-input>

    <!-- Database Engine Selection -->
    <div class="space-y-2">
      <label class="text-xs font-medium text-neutral-300 select-none">
        Motor de Base de Datos <span class="text-danger-400">*</span>
      </label>
      <div class="grid grid-cols-3 gap-3">
        <!-- PostgreSQL -->
        <div
          (click)="engine = 'postgresql'"
          class="p-3 rounded-xl border transition-all cursor-pointer flex flex-col items-center gap-1.5 text-center select-none"
          [ngClass]="{
            'border-primary-500 bg-primary-500/10 text-white shadow-sm ring-1 ring-primary-500/30': engine === 'postgresql',
            'border-neutral-700/80 bg-surface-container-low hover:border-neutral-600 text-neutral-300': engine !== 'postgresql'
          }"
        >
          <sc-icon name="database" [size]="20" [customClass]="engine === 'postgresql' ? 'text-primary-400' : 'text-neutral-400'"></sc-icon>
          <span class="text-xs font-semibold">PostgreSQL</span>
          <span class="text-[9px] font-mono text-neutral-400">Recomendado</span>
        </div>

        <!-- MySQL -->
        <div
          (click)="engine = 'mysql'"
          class="p-3 rounded-xl border transition-all cursor-pointer flex flex-col items-center gap-1.5 text-center select-none"
          [ngClass]="{
            'border-primary-500 bg-primary-500/10 text-white shadow-sm ring-1 ring-primary-500/30': engine === 'mysql',
            'border-neutral-700/80 bg-surface-container-low hover:border-neutral-600 text-neutral-300': engine !== 'mysql'
          }"
        >
          <sc-icon name="dns" [size]="20" [customClass]="engine === 'mysql' ? 'text-primary-400' : 'text-neutral-400'"></sc-icon>
          <span class="text-xs font-semibold">MySQL 8.4</span>
          <span class="text-[9px] font-mono text-neutral-400">Estándar</span>
        </div>

        <!-- SQLite -->
        <div
          (click)="engine = 'sqlite'"
          class="p-3 rounded-xl border transition-all cursor-pointer flex flex-col items-center gap-1.5 text-center select-none"
          [ngClass]="{
            'border-primary-500 bg-primary-500/10 text-white shadow-sm ring-1 ring-primary-500/30': engine === 'sqlite',
            'border-neutral-700/80 bg-surface-container-low hover:border-neutral-600 text-neutral-300': engine !== 'sqlite'
          }"
        >
          <sc-icon name="storage" [size]="20" [customClass]="engine === 'sqlite' ? 'text-primary-400' : 'text-neutral-400'"></sc-icon>
          <span class="text-xs font-semibold">SQLite 3</span>
          <span class="text-[9px] font-mono text-neutral-400">Embebido</span>
        </div>
      </div>
    </div>

    <div class="pt-3 flex items-center justify-end gap-2.5 border-t border-neutral-800">
      <sc-button
        type="button"
        variant="ghost"
        size="md"
        (onClick)="close()"
      >
        Cancelar
      </sc-button>

      <sc-button
        type="submit"
        variant="primary"
        size="md"
        icon="add"
        [loading]="loading"
      >
        Crear y abrir esquema
      </sc-button>
    </div>
  </form>
</sc-modal-shell>
