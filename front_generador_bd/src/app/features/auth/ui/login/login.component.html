<div class="min-h-screen w-full flex items-center justify-center bg-surface-lowest text-neutral-100 p-4 relative overflow-hidden selection:bg-primary-500/30 selection:text-primary-200">
  <!-- Subtle Background Ambient Glow & Grid -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,rgba(99,102,241,0.08),transparent_55%)] pointer-events-none"></div>
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b14_1px,transparent_1px),linear-gradient(to_bottom,#1e293b14_1px,transparent_1px)] bg-[size:32px_32px] pointer-events-none"></div>

  <!-- Centered Minimalist Auth Card -->
  <div class="relative z-10 w-full max-w-md">
    <div class="glass-panel p-8 sm:p-10 rounded-2xl shadow-2xl border border-neutral-800/80 flex flex-col space-y-6">
      
      <!-- Brand Logo & Header (Centered) -->
      <div class="flex flex-col items-center text-center space-y-3">
        <div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-primary-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-primary-500/25 ring-1 ring-white/20">
          <sc-icon name="account_tree" [size]="24" customClass="text-white"></sc-icon>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white">SchemaCraft</h1>
          <p class="text-xs text-neutral-400 mt-1">
            {{ mode === 'login' ? 'Inicia sesión para acceder a tus proyectos' : 'Crea tu cuenta de desarrollador' }}
          </p>
        </div>
      </div>

      <!-- Continue with Google Button -->
      <button
        type="button"
        (click)="loginWithGoogle()"
        [disabled]="loading"
        class="w-full flex items-center justify-center gap-3 py-2.5 px-4 rounded-lg bg-surface-container hover:bg-surface-container-high border border-neutral-700/70 text-neutral-200 hover:text-white font-medium text-sm transition-all duration-150 active:scale-[0.99] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <!-- Google Official Logo SVG -->
        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <!-- Horizontal Centered Divider -->
      <div class="relative flex items-center justify-center my-1">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-neutral-700/60"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="bg-[#121b2d] px-3 text-xs text-neutral-400 whitespace-nowrap select-none font-sans">
            o continúa con correo
          </span>
        </div>
      </div>

      <!-- Email/Password Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Full Name (Register Only) -->
        <sc-input
          *ngIf="mode === 'register'"
          inputId="auth-fullname"
          label="Nombre Completo"
          icon="badge"
          placeholder="Tu nombre completo"
          [(ngModel)]="fullName"
          name="fullName"
          [required]="true"
          [error]="errors.fullName"
        ></sc-input>

        <!-- Email -->
        <sc-input
          inputId="auth-email"
          label="Correo electrónico"
          type="email"
          icon="mail"
          placeholder="nombre@ejemplo.com"
          [(ngModel)]="email"
          name="email"
          [required]="true"
          [error]="errors.email"
        ></sc-input>

        <!-- Password -->
        <sc-input
          inputId="auth-password"
          label="Contraseña"
          type="password"
          icon="lock"
          placeholder="••••••••••••"
          [(ngModel)]="password"
          name="password"
          [required]="true"
          [hint]="mode === 'register' ? 'Mínimo 6 caracteres' : undefined"
          [error]="errors.password"
        ></sc-input>

        <!-- Remember & Forgot Password (Login Only) -->
        <div *ngIf="mode === 'login'" class="flex items-center justify-between text-xs pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer text-neutral-400 hover:text-neutral-200 select-none">
            <input
              type="checkbox"
              [(ngModel)]="rememberMe"
              name="rememberMe"
              class="rounded bg-surface-container border-neutral-700 text-primary focus:ring-primary-500 focus:ring-offset-surface-lowest cursor-pointer"
            />
            <span>Recordar sesión</span>
          </label>

          <button
            type="button"
            (click)="forgotPassword()"
            class="text-primary-400 hover:text-primary-300 font-medium transition-colors bg-transparent border-0 p-0 cursor-pointer text-xs"
          >
            ¿Olvidaste tu contraseña?
          </button>
        </div>

        <!-- General Error Banner -->
        <div
          *ngIf="generalError"
          class="p-3 rounded-lg bg-danger-500/10 border border-danger-500/30 text-danger-400 text-xs flex items-start gap-2"
        >
          <sc-icon name="error" [size]="16" customClass="shrink-0 mt-0.5"></sc-icon>
          <span>{{ generalError }}</span>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <sc-button
            type="submit"
            variant="primary"
            size="lg"
            [loading]="loading"
            customClass="w-full shadow-lg shadow-primary-500/25"
          >
            {{ mode === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta' }}
          </sc-button>
        </div>
      </form>

      <!-- Toggle between Login and Register -->
      <div class="text-center pt-2 border-t border-neutral-800/80 text-xs text-neutral-400">
        <span *ngIf="mode === 'login'">
          ¿No tienes una cuenta?
          <button
            type="button"
            (click)="toggleMode('register')"
            class="text-primary-400 hover:text-primary-300 font-semibold ml-1 transition-colors cursor-pointer bg-transparent border-0 p-0"
          >
            Crear cuenta
          </button>
        </span>

        <span *ngIf="mode === 'register'">
          ¿Ya tienes una cuenta?
          <button
            type="button"
            (click)="toggleMode('login')"
            class="text-primary-400 hover:text-primary-300 font-semibold ml-1 transition-colors cursor-pointer bg-transparent border-0 p-0"
          >
            Iniciar sesión
          </button>
        </span>
      </div>

    </div>
  </div>
</div>
