<div class="flex flex-col items-center justify-center text-center p-8 sm:p-12 border border-dashed border-neutral-800 rounded-2xl bg-surface/40 select-none">
  <!-- Icon Circle with subtle ambient pulse -->
  <div class="h-14 w-14 rounded-2xl bg-surface-container flex items-center justify-center border border-neutral-700/60 shadow-inner mb-4 text-primary-400">
    <sc-icon [name]="icon" [size]="28"></sc-icon>
  </div>

  <h3 class="text-base font-semibold text-neutral-200 tracking-tight mb-1">
    {{ title }}
  </h3>

  <p class="text-xs text-neutral-400 max-w-sm mb-6 leading-relaxed">
    {{ description }}
  </p>

  <sc-button
    *ngIf="actionLabel"
    variant="primary"
    size="md"
    icon="add"
    (onClick)="onAction.emit()"
  >
    {{ actionLabel }}
  </sc-button>
</div>
