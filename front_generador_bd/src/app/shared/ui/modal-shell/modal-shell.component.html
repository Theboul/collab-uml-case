@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">
    <div
      class="w-full bg-surface-container rounded-2xl border border-neutral-700 shadow-2xl overflow-hidden animate-scaleUp"
      [class.max-w-md]="size === 'md'"
      [class.max-w-lg]="size === 'lg'"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="p-6 pb-4 border-b border-neutral-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-primary-500/15 text-primary-400 flex items-center justify-center border border-primary-500/20">
            <sc-icon [name]="icon" [size]="20"></sc-icon>
          </div>
          <div>
            <h3 class="text-base font-semibold text-white tracking-tight">{{ title }}</h3>
            @if (subtitle) {
              <p class="text-xs text-neutral-400">{{ subtitle }}</p>
            }
          </div>
        </div>

        <button
          type="button"
          (click)="close()"
          class="text-neutral-400 hover:text-white p-1 rounded-lg hover:bg-surface-container-high transition-colors cursor-pointer"
          title="Cerrar modal"
        >
          <sc-icon name="close" [size]="18"></sc-icon>
        </button>
      </div>

      <!-- Cuerpo y pie de acciones: contenido de cada consumidor -->
      <ng-content></ng-content>
    </div>
  </div>
}
