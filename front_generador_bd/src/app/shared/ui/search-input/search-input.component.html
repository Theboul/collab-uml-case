<div
  class="relative flex items-center w-full rounded-lg bg-surface-container/80 border border-neutral-700/60 hover:border-neutral-600 focus-within:border-primary-500 focus-within:ring-2 focus-within:ring-primary-500/20 transition-all duration-150 group"
  [ngClass]="customClass"
>
  <!-- Search Icon -->
  <div class="pl-3 pr-2 text-neutral-500 flex items-center pointer-events-none group-focus-within:text-primary-400 transition-colors">
    <sc-icon name="search" [size]="18"></sc-icon>
  </div>

  <!-- Search Input -->
  <input
    type="text"
    [value]="value"
    [placeholder]="placeholder"
    (input)="onInputChange($event)"
    (keydown.enter)="onEnter.emit(value)"
    class="w-full bg-transparent text-xs text-neutral-100 placeholder-neutral-500 py-2 focus:outline-none font-sans"
  />

  <!-- Clear Button or Keyboard Shortcut -->
  <div class="pr-2.5 flex items-center">
    <button
      *ngIf="value"
      type="button"
      (click)="clear()"
      class="text-neutral-500 hover:text-neutral-300 p-0.5 rounded transition-colors focus:outline-none cursor-pointer"
      title="Limpiar búsqueda"
    >
      <sc-icon name="close" [size]="14"></sc-icon>
    </button>

    <kbd
      *ngIf="!value && shortcut"
      class="hidden sm:inline-flex items-center px-1.5 py-0.5 text-[10px] font-mono text-neutral-500 bg-surface-lowest rounded border border-neutral-800 pointer-events-none select-none"
    >
      {{ shortcut }}
    </kbd>
  </div>
</div>
