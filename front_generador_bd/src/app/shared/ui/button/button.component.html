<button
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel"
  (click)="handleClick($event)"
  class="inline-flex items-center justify-center font-medium transition-all duration-150 rounded-lg select-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:pointer-events-none focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2 focus-visible:ring-offset-surface-lowest"
  [ngClass]="[variantClasses, sizeClasses, customClass]"
>
  <!-- Loading Spinner -->
  <svg
    *ngIf="loading"
    class="animate-spin -ml-0.5 mr-2 h-4 w-4 text-current"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
  >
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>

  <!-- Leading Icon -->
  <sc-icon
    *ngIf="icon && !loading"
    [name]="icon"
    [size]="iconSize"
    [customClass]="hasContent ? 'mr-1.5' : ''"
  ></sc-icon>

  <!-- Button Content -->
  <span class="truncate" [ngClass]="{ 'opacity-0': loading && size === 'icon' }">
    <ng-content></ng-content>
  </span>

  <!-- Trailing Icon -->
  <sc-icon
    *ngIf="trailingIcon && !loading"
    [name]="trailingIcon"
    [size]="iconSize"
    customClass="ml-1.5"
  ></sc-icon>
</button>
